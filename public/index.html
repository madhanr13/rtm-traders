<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTM TRADERS — Sign In</title>
    <meta name="description" content="Sign in to your RTM Traders dashboard to manage shipments and track business performance.">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Prevent FOUC -->
    <script>
        (function(){
            const stored = localStorage.getItem('rtm-theme');
            let theme = 'dark';
            if (stored === 'light') theme = 'light';
            else if (stored === 'dark') theme = 'dark';
            else if (stored === 'system' || !stored) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-sans" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;">

    <div style="width:100%;max-width:400px;">
        <!-- Card -->
        <div class="card" style="padding:0;overflow:hidden;">
            <!-- Header -->
            <div style="padding:32px 32px 0;text-align:center;">
                <div style="width:56px;height:56px;border-radius:14px;overflow:hidden;margin:0 auto 16px;border:2px solid var(--c-border);">
                    <img src="logo.jpg" alt="RTM TRADERS" style="width:100%;height:100%;object-fit:cover;">
                </div>
                <h1 style="font-size:20px;font-weight:600;color:var(--c-text);margin:0 0 4px;">RTM Traders</h1>
                <p style="font-size:13px;color:var(--c-text-muted);margin:0;">Sign in to access your dashboard</p>
            </div>

            <!-- Form -->
            <form id="loginForm" method="POST" action="#" novalidate style="padding:24px 32px 32px;">
                <div style="margin-bottom:16px;">
                    <label for="username" class="form-label">Email</label>
                    <div style="position:relative;">
                        <div style="position:absolute;top:50%;left:12px;transform:translateY(-50%);pointer-events:none;">
                            <i class="fas fa-envelope" style="font-size:13px;color:var(--c-text-muted);"></i>
                        </div>
                        <input type="text" id="username" name="username" placeholder="you@example.com" required autocomplete="username"
                               class="form-input" style="padding-left:36px;">
                    </div>
                </div>

                <div style="margin-bottom:12px;">
                    <label for="password" class="form-label">Password</label>
                    <div style="position:relative;">
                        <div style="position:absolute;top:50%;left:12px;transform:translateY(-50%);pointer-events:none;">
                            <i class="fas fa-lock" style="font-size:13px;color:var(--c-text-muted);"></i>
                        </div>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password"
                               class="form-input" style="padding-left:36px;">
                    </div>
                </div>

                <div style="text-align:right;margin-bottom:20px;">
                    <a href="mailto:madhanr13@zohomail.in?subject=RTM Traders - Password Reset Request&body=Vanakkam Madhan,%0D%0A%0D%0AI forgot the password, Kindly help me reseting the password.%0D%0A%0D%0AThank you."
                       style="font-size:12px;color:var(--c-accent);text-decoration:none;font-weight:500;">Forgot password?</a>
                </div>

                <button type="submit" class="submit-btn btn btn-primary" style="width:100%;padding:10px;font-size:14px;">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right" style="font-size:12px;"></i>
                </button>

                <div id="errorMessage" style="display:none;margin-top:16px;padding:10px 14px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:8px;color:#EF4444;font-size:13px;"></div>
            </form>
        </div>

        <!-- Footer -->
        <p style="text-align:center;margin-top:20px;font-size:11px;color:var(--c-text-muted);">
            &copy; 2024 RTM Traders. All rights reserved.
        </p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
