<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTM TRADERS — Dashboard</title>
    <meta name="description" content="RTM Traders business dashboard — track shipments, revenue, and profitability.">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- Prevent FOUC: apply theme immediately -->
    <script>
        (function(){
            const stored = localStorage.getItem('rtm-theme');
            let theme = 'dark';
            if (stored === 'light') theme = 'light';
            else if (stored === 'dark') theme = 'dark';
            else if (stored === 'system' || !stored) theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="font-sans">
    <div class="app-layout">

        <!-- Sidebar backdrop (mobile) -->
        <div id="sidebarBackdrop" class="sidebar-backdrop" onclick="closeMobileSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
            <div class="sidebar-header">
                <img src="logo.jpg" alt="RTM" class="sidebar-logo">
                <span class="sidebar-title">RTM Traders</span>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section-label">Menu</div>
                <a href="#overview" class="nav-item active" data-page="overview" onclick="closeMobileSidebar()">
                    <i class="fas fa-chart-line"></i>
                    <span class="nav-label">Overview</span>
                </a>
                <a href="#records" class="nav-item" data-page="records" onclick="closeMobileSidebar()">
                    <i class="fas fa-table-list"></i>
                    <span class="nav-label">Records</span>
                </a>
                <a href="#settings" class="nav-item" data-page="settings" onclick="closeMobileSidebar()">
                    <i class="fas fa-gear"></i>
                    <span class="nav-label">Settings</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar"><i class="fas fa-user"></i></div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="sidebarUserName">Admin</div>
                        <div class="sidebar-user-role">Administrator</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <div class="main-area">
            <!-- Header -->
            <header class="app-header" role="banner">
                <div class="header-left">
                    <button id="menuBtn" class="header-btn md:hidden" aria-label="Open menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button id="sidebarToggle" class="header-btn hidden md:flex" aria-label="Toggle sidebar">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb">
                        <span>Dashboard</span>
                        <i class="fas fa-chevron-right breadcrumb-sep"></i>
                        <span class="breadcrumb-current" id="breadcrumbPage">Overview</span>
                    </div>
                </div>
                <div class="header-right">
                    <span class="header-date" id="currentDate"></span>
                    <button id="themeToggle" class="header-btn" aria-label="Toggle theme">
                        <i class="fas fa-moon" id="themeIcon"></i>
                    </button>
                    <div class="header-user">
                        <div>
                            <div class="header-user-name" id="headerUserName">Admin</div>
                        </div>
                    </div>
                    <button id="logoutBtn" class="header-btn" aria-label="Sign out" title="Sign out">
                        <i class="fas fa-right-from-bracket"></i>
                    </button>
                </div>
            </header>

            <!-- Page content (rendered by router) -->
            <main class="main-content" id="appContent" role="main">
                <!-- Dynamic content injected here -->
            </main>
        </div>
    </div>

    <!-- ===== MODALS ===== -->

    <!-- Add/Edit Record Modal -->
    <div id="recordModal" class="modal-overlay" role="dialog" aria-labelledby="recordModalTitle">
        <div class="modal" style="max-width: 560px;">
            <div class="modal-header">
                <h2 class="modal-title" id="recordModalTitle">Add Record</h2>
                <button onclick="closeRecordModal()" class="header-btn btn-sm" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="recordForm" novalidate>
                <div class="modal-body">
                    <input type="hidden" id="recordId">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="recordDate" class="form-label">Date</label>
                            <input type="date" id="recordDate" class="form-input" required>
                        </div>
                        <div>
                            <label for="vehicleNumber" class="form-label">Vehicle Number</label>
                            <input type="text" id="vehicleNumber" class="form-input" placeholder="e.g. TN 01 AB 1234" required>
                        </div>
                        <div class="sm:col-span-2">
                            <label for="destination" class="form-label">Destination / Company</label>
                            <input type="text" id="destination" class="form-input" placeholder="e.g. Chennai Aggregates" required>
                        </div>
                        <div>
                            <label for="weightInTons" class="form-label">Weight (Tons)</label>
                            <input type="number" id="weightInTons" class="form-input" step="0.001" placeholder="0.000" required>
                        </div>
                        <div>
                            <label for="ratePerTon" class="form-label">Rate Per Ton (₹)</label>
                            <input type="number" id="ratePerTon" class="form-input" step="0.01" placeholder="0.00" required>
                        </div>
                        <div>
                            <label for="amountSpend" class="form-label">Amount Spent (₹) <span style="font-weight:400;color:var(--c-text-muted)">Auto</span></label>
                            <input type="number" id="amountSpend" class="form-input" step="0.01" readonly>
                        </div>
                        <div>
                            <label for="rateWeFixed" class="form-label">Rate We Fixed (₹)</label>
                            <input type="number" id="rateWeFixed" class="form-input" step="0.01" placeholder="0.00" required>
                        </div>
                        <div>
                            <label for="totalProfit" class="form-label">Total Profit (₹) <span style="font-weight:400;color:var(--c-text-muted)">Auto</span></label>
                            <input type="number" id="totalProfit" class="form-input" step="0.01" readonly>
                        </div>
                        <div class="flex items-center gap-3 pt-4">
                            <input type="checkbox" id="amountReceived" class="w-4 h-4">
                            <label for="amountReceived" class="form-label" style="margin:0">Amount Received</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" onclick="closeRecordModal()" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Logout Confirmation Modal -->
    <div id="logoutModal" class="modal-overlay" role="dialog" aria-labelledby="logoutModalTitle">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-body" style="text-align:center;padding:32px 24px;">
                <div style="width:48px;height:48px;border-radius:12px;background:rgba(239,68,68,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                    <i class="fas fa-right-from-bracket" style="font-size:20px;color:#EF4444;"></i>
                </div>
                <h3 id="logoutModalTitle" style="font-size:16px;font-weight:600;color:var(--c-text);margin:0 0 8px;">Sign Out</h3>
                <p style="font-size:13px;color:var(--c-text-muted);margin:0;">Are you sure you want to sign out of your account?</p>
            </div>
            <div class="modal-footer" style="justify-content:center;">
                <button onclick="closeLogoutModal()" class="btn btn-secondary">Cancel</button>
                <button onclick="confirmLogout()" class="btn btn-danger"><i class="fas fa-right-from-bracket"></i> Sign Out</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal-overlay" role="dialog" aria-labelledby="deleteModalTitle">
        <div class="modal" style="max-width: 400px;">
            <div class="modal-body" style="text-align:center;padding:32px 24px;">
                <div style="width:48px;height:48px;border-radius:12px;background:rgba(239,68,68,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
                    <i class="fas fa-trash" style="font-size:20px;color:#EF4444;"></i>
                </div>
                <h3 id="deleteModalTitle" style="font-size:16px;font-weight:600;color:var(--c-text);margin:0 0 8px;">Delete Record</h3>
                <p style="font-size:13px;color:var(--c-text-muted);margin:0;">This action cannot be undone. Are you sure you want to permanently delete this record?</p>
            </div>
            <div class="modal-footer" style="justify-content:center;">
                <button onclick="closeDeleteModal()" class="btn btn-secondary">Cancel</button>
                <button onclick="confirmDelete()" class="btn btn-danger"><i class="fas fa-trash"></i> Delete</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
